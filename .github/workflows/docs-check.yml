name: Check documentation and webcanvas
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/*.test.mjs
      - run: node build-static.mjs --check
      - run: node tools/sync-docs.mjs
      - run: node tools/build-site.mjs
